<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  set,
  runTransaction
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

import {
  getAuth,
  signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =================================
   🔥 PUT YOUR FIREBASE INFO HERE
================================= */

const firebaseConfig = {

  apiKey: "PASTE_API_KEY_HERE",

  authDomain:
    "PASTE_PROJECT_ID.firebaseapp.com",

  databaseURL:
    "PASTE_DATABASE_URL_HERE",

  projectId:
    "PASTE_PROJECT_ID",

  storageBucket:
    "PASTE_PROJECT_ID.firebasestorage.app",

  messagingSenderId:
    "PASTE_SENDER_ID",

  appId:
    "PASTE_APP_ID"
};


/* =================================
   START FIREBASE
================================= */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);

let playerUID = null;


/* =================================
   LOGIN PLAYER
================================= */

async function connectFirebase(){

  try{

    const login =
      await signInAnonymously(auth);

    playerUID =
      login.user.uid;

    console.log(
      "🔥 FIREBASE ONLINE"
    );

    listenForStock();

  }

  catch(error){

    console.error(
      "Firebase error:",
      error
    );

  }

}


/* =================================
   GLOBAL SHOP
================================= */

const stockRef =
  ref(
    db,
    "global/shopStock"
  );


/* =================================
   LISTEN FOR GLOBAL STOCK
================================= */

function listenForStock(){

  onValue(
    stockRef,
    snapshot => {

      const stock =
        snapshot.val();

      if(!stock){
        return;
      }


      console.log(
        "🌎 Global stock:",
        stock
      );


      /*
       Update your game's stock
      */

      if(
        typeof game !==
        "undefined"
      ){

        game.shopStock =
          stock;


        if(
          typeof saveGame ===
          "function"
        ){

          saveGame();

        }


        if(
          typeof render ===
          "function"
        ){

          render();

        }

      }

    }
  );

}


/* =================================
   BUY GLOBAL SEED

   Prevents 2 players from buying
   the same last seed.
================================= */

window.buyGlobalSeed =
async function(seedName){

  const seedRef =
    ref(
      db,
      "global/shopStock/" +
      seedName
    );


  const result =
    await runTransaction(

      seedRef,

      stock => {

        stock =
          Number(stock || 0);


        if(stock <= 0){

          return;

        }


        return stock - 1;

      }

    );


  if(!result.committed){

    return {
      success:false,
      reason:"SOLD_OUT"
    };

  }


  return {

    success:true,

    stock:
      result.snapshot.val()

  };

};


/* =================================
   🌎 ADMIN GLOBAL RESTOCK
================================= */

window.globalRestockSeeds =
async function(){

  const seeds = [

    "common",
    "rare",
    "quantum",
    "epic",
    "nebula",
    "supernova",
    "mythic",
    "void",
    "ancient",
    "infinity",
    "bedrock",
    "matrix",

    "prism",
    "glitch",
    "cosmic",
    "galaxy",

    "infinity2",
    "adminium",

    "crystal",
    "storm",
    "lunar",
    "solar",

    "chaos",
    "celestial",

    "golden",
    "ghost",
    "tree",
    "diamond"

  ];


  const newStock = {};


  seeds.forEach(
    seed => {

      /*
       RANDOM 1 - 5 STOCK
      */

      newStock[seed] =
        Math.floor(
          Math.random() * 5
        ) + 1;

    }
  );


  await set(
    stockRef,
    newStock
  );


  console.log(
    "🌎 GLOBAL RESTOCK COMPLETE!"
  );


  if(
    typeof showGlobalToast ===
    "function"
  ){

    showGlobalToast(
      "🌎 GLOBAL RESTOCK! 1-5 STOCK!"
    );

  }

};


/* =================================
   CONNECT
================================= */

connectFirebase();

</script>
